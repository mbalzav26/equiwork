<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Wireframe — Reportes</title>
    <link rel="stylesheet" href="wireframe.css" />
  </head>
  <body>
    <p class="frame-label">Desktop · 1280 — Reportes quincenales</p>
    <div class="frame" style="max-width: 1280px">
      <div class="wf-shell">
        <aside class="wf-sidebar">
          <div class="wf-sidebar-head">
            <div class="wf-logo"></div>
            <span class="wf-brand">EquiWork</span>
          </div>
          <div class="wf-user">
            <div class="wf-user-line"></div>
            <div class="wf-user-line sm"></div>
          </div>
          <nav class="wf-nav">
            <div class="wf-nav-item"><span class="wf-nav-icon"></span> Dashboard</div>
            <div class="wf-nav-item"><span class="wf-nav-icon"></span> Colaboradores</div>
            <div class="wf-nav-item"><span class="wf-nav-icon"></span> Eventos</div>
            <div class="wf-nav-item active"><span class="wf-nav-icon"></span> Reportes</div>
          </nav>
        </aside>
        <div class="wf-main">
          <header class="wf-top"><div class="wf-btn-ghost">Cerrar sesión</div></header>
          <div class="wf-content">
            <div class="wf-row" style="justify-content: space-between; flex-wrap: wrap">
              <div>
                <h1 class="wf-title">Reportes quincenales</h1>
                <p class="wf-sub">Exportación del resumen de carga</p>
              </div>
              <div class="wf-row" style="margin: 0">
                <div class="wf-field" style="min-width: 200px">
                  <p class="wf-label">Quincena</p>
                  <div class="wf-select"></div>
                </div>
                <div class="wf-btn">Vista previa</div>
                <div class="wf-btn primary">Exportar CSV</div>
              </div>
            </div>
            <div class="wf-card" style="margin-top: 8px">
              <div class="wf-card-h">Vista previa JSON</div>
              <div class="wf-card-b">
                <div class="wf-preview">
                  <div class="wf-preview-line"></div>
                  <div class="wf-preview-line" style="width: 75%"></div>
                  <div class="wf-preview-line" style="width: 85%"></div>
                  <div class="wf-preview-line" style="width: 60%"></div>
                  <div class="wf-preview-line" style="width: 90%"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>

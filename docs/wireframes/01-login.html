<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Wireframe — Login</title>
    <link rel="stylesheet" href="wireframe.css" />
  </head>
  <body>
    <p class="frame-label">Desktop · 1280 — Login / Iniciar sesión</p>
    <div class="frame" style="max-width: 1280px">
      <div class="wf-login-split">
        <aside class="wf-login-brand">
          <div>
            <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 32px">
              <div class="wf-logo"></div>
              <span class="wf-brand">EquiWork</span>
            </div>
            <div class="wf-block w80"></div>
            <div class="wf-block w60"></div>
            <div class="wf-block" style="margin-top: 24px; width: 90%"></div>
          </div>
          <span style="font-size: 11px; opacity: 0.5">© EquiWork</span>
        </aside>
        <section class="wf-login-form">
          <h1 class="wf-title">Iniciar sesión</h1>
          <p class="wf-sub">Ingresa con tu correo corporativo</p>
          <div class="wf-form-stack" style="max-width: 380px">
            <p class="wf-label">Correo</p>
            <div class="wf-input"></div>
            <p class="wf-label">Contraseña</p>
            <div class="wf-input"></div>
            <div class="wf-btn primary" style="width: 100%; margin-top: 8px">Ingresar</div>
          </div>
          <div
            style="
              margin-top: 32px;
              max-width: 380px;
              padding: 16px;
              border: 1px dashed #ccc;
              border-radius: 12px;
            "
          >
            <p class="wf-label">Cuentas demo</p>
            <div class="wf-cell" style="max-width: 100%; height: 8px; margin-bottom: 6px"></div>
            <div class="wf-cell" style="max-width: 80%; height: 8px"></div>
          </div>
        </section>
      </div>
    </div>
  </body>
</html>

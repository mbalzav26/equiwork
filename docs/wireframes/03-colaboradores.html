<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Wireframe — Colaboradores</title>
    <link rel="stylesheet" href="wireframe.css" />
  </head>
  <body>
    <p class="frame-label">Desktop · 1280 — Colaboradores</p>
    <div class="frame" style="max-width: 1280px">
      <div class="wf-shell">
        <aside class="wf-sidebar">
          <div class="wf-sidebar-head">
            <div class="wf-logo"></div>
            <span class="wf-brand">EquiWork</span>
          </div>
          <div class="wf-user">
            <div class="wf-user-line"></div>
            <div class="wf-user-line sm"></div>
          </div>
          <nav class="wf-nav">
            <div class="wf-nav-item"><span class="wf-nav-icon"></span> Dashboard</div>
            <div class="wf-nav-item active"><span class="wf-nav-icon"></span> Colaboradores</div>
            <div class="wf-nav-item"><span class="wf-nav-icon"></span> Eventos</div>
            <div class="wf-nav-item"><span class="wf-nav-icon"></span> Reportes</div>
          </nav>
        </aside>
        <div class="wf-main">
          <header class="wf-top"><div class="wf-btn-ghost">Cerrar sesión</div></header>
          <div class="wf-content">
            <div class="wf-row" style="justify-content: space-between; align-items: center">
              <div>
                <h1 class="wf-title">Colaboradores</h1>
                <p class="wf-sub">Alta, edición y acceso a encuesta</p>
              </div>
              <div class="wf-btn primary">Nuevo colaborador</div>
            </div>
            <div
              style="
                padding: 14px 16px;
                border: 1px dashed #ccc;
                border-radius: 10px;
                margin-bottom: 20px;
                font-size: 12px;
                color: #888;
              "
            >
              Banner ayuda · cuenta encuesta demo
            </div>
            <div class="wf-card">
              <div class="wf-card-b" style="padding: 0">
                <table class="wf-table">
                  <thead>
                    <tr>
                      <th>Nombre</th>
                      <th>Cargo / Área</th>
                      <th>Email</th>
                      <th>Encuesta</th>
                      <th>Acciones</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr>
                      <td><div class="wf-cell"></div></td>
                      <td><div class="wf-cell"></div></td>
                      <td><div class="wf-cell" style="max-width: 140px"></div></td>
                      <td><div class="wf-cell" style="width: 48px"></div></td>
                      <td><div class="wf-row" style="margin: 0; gap: 8px"><div class="wf-btn" style="min-width: 64px; height: 28px"></div><div class="wf-btn" style="min-width: 64px; height: 28px"></div></div></td>
                    </tr>
                    <tr>
                      <td><div class="wf-cell"></div></td>
                      <td><div class="wf-cell"></div></td>
                      <td><div class="wf-cell" style="max-width: 140px"></div></td>
                      <td><div class="wf-cell" style="width: 48px"></div></td>
                      <td><div class="wf-row" style="margin: 0; gap: 8px"><div class="wf-btn" style="min-width: 64px; height: 28px"></div><div class="wf-btn" style="min-width: 64px; height: 28px"></div></div></td>
                    </tr>
                    <tr>
                      <td><div class="wf-cell"></div></td>
                      <td><div class="wf-cell"></div></td>
                      <td><div class="wf-cell" style="max-width: 140px"></div></td>
                      <td><div class="wf-cell" style="width: 48px"></div></td>
                      <td><div class="wf-row" style="margin: 0; gap: 8px"><div class="wf-btn" style="min-width: 64px; height: 28px"></div><div class="wf-btn" style="min-width: 64px; height: 28px"></div></div></td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
            <div
              style="
                margin-top: 24px;
                width: 360px;
                padding: 20px;
                border: 2px dashed #b8b8c4;
                border-radius: 12px;
                background: #fafafa;
              "
            >
              <p class="wf-label">Modal · Nuevo colaborador</p>
              <div class="wf-input" style="margin-bottom: 10px"></div>
              <div class="wf-input" style="margin-bottom: 10px"></div>
              <div class="wf-row"><div class="wf-btn"></div><div class="wf-btn primary"></div></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>

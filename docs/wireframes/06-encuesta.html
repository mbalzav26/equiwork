<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Wireframe — Encuesta</title>
    <link rel="stylesheet" href="wireframe.css" />
  </head>
  <body>
    <p class="frame-label">Desktop · 1280 — Encuesta colaborador</p>
    <div class="frame" style="max-width: 1280px">
      <div class="wf-shell">
        <aside class="wf-sidebar">
          <div class="wf-sidebar-head">
            <div class="wf-logo"></div>
            <span class="wf-brand">EquiWork</span>
          </div>
          <div class="wf-user">
            <div class="wf-user-line"></div>
            <div class="wf-user-line sm"></div>
          </div>
          <nav class="wf-nav">
            <div class="wf-nav-item active"><span class="wf-nav-icon"></span> Encuesta</div>
          </nav>
        </aside>
        <div class="wf-main">
          <header class="wf-top"><div class="wf-btn-ghost">Cerrar sesión</div></header>
          <div class="wf-content">
            <p class="wf-tag">Autoreporte quincenal</p>
            <h1 class="wf-title">Encuesta de actividades</h1>
            <p class="wf-sub">Solo tu información · registro personal</p>
            <div class="wf-kpi-grid" style="grid-template-columns: repeat(3, 1fr); max-width: 720px">
              <div class="wf-kpi"><p class="wf-kpi-l">Tus eventos</p><div class="wf-kpi-v"></div></div>
              <div class="wf-kpi"><p class="wf-kpi-l">Horas reportadas</p><div class="wf-kpi-v"></div></div>
              <div class="wf-kpi"><p class="wf-kpi-l">Quincena</p><div class="wf-kpi-v"></div></div>
            </div>
            <div class="wf-grid-2">
              <div class="wf-card">
                <div class="wf-card-h">Agregar actividad</div>
                <div class="wf-card-b">
                  <p class="wf-label">Quincena</p>
                  <div class="wf-select" style="margin-bottom: 12px"></div>
                  <div class="wf-row">
                    <div class="wf-field"><p class="wf-label">Fecha</p><div class="wf-input"></div></div>
                    <div class="wf-field"><p class="wf-label">Horas</p><div class="wf-input"></div></div>
                  </div>
                  <p class="wf-label">Tipo</p>
                  <div class="wf-select" style="margin-bottom: 12px"></div>
                  <p class="wf-label">Descripción</p>
                  <div class="wf-input" style="margin-bottom: 16px"></div>
                  <div class="wf-btn primary" style="width: 100%">Enviar actividad</div>
                </div>
              </div>
              <div class="wf-card">
                <div class="wf-card-h">Tu historial</div>
                <div class="wf-card-b">
                  <div style="padding: 10px 0; border-bottom: 1px solid #eee">
                    <div class="wf-cell" style="max-width: 100%"></div>
                  </div>
                  <div style="padding: 10px 0; border-bottom: 1px solid #eee">
                    <div class="wf-cell" style="max-width: 100%"></div>
                  </div>
                  <div style="padding: 10px 0">
                    <div class="wf-cell" style="max-width: 100%"></div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
